<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PhishGuard AI</title>
  <style>
    body { margin: 0; width: 300px; padding: 14px 16px; background: #ffffff; color: #202124;
           font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .status { padding: 8px 10px; border-radius: 6px; background: #f1f3f4; border-left: 4px solid #80868b; }
    .status.online { background: #e6f4ea; border-left-color: #137333; }
    .status.offline { background: #fce8e6; border-left-color: #b3261e; }
    code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: #f1f3f4; padding: 1px 4px;
           border-radius: 3px; word-break: break-all; }
    label { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0; cursor: pointer; }
    input { margin-top: 3px; }
    .note { color: #5f6368; font-size: 12px; margin: 0; }
  </style>
</head>
<body>
  <h1>PhishGuard AI for Gmail</h1>
  <div id="status" class="status" role="status">Checking the backend…</div>
  <label>
    <input type="checkbox" id="auto-check" checked>
    <span>Check each email automatically when I open it</span>
  </label>
  <p class="note">Emails are sent only to the PhishGuard backend on this computer (127.0.0.1:5000). The backend keeps a hash of each email, not its text, and allows 100 checks per hour.</p>
  <script src="popup.js"></script>
</body>
</html>
